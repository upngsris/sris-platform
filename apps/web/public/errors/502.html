<!doctype html>
<!--
  Standalone 502 page for the gateway in front of the site (reverse proxy,
  load balancer or CDN). It must work when the Next.js app is down, so it has
  no scripts, no web fonts and no external files. Configure the gateway to
  serve this file with status 502. See apps/web/docs/status-pages.md.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>502 Bad Gateway | UPNG SRIS</title>
<style>
  :root {
    --deep: #002c53;
    --ink: #0f172a;
    --paper: #f8fafc;
    --on-deep-muted: #dbe4ee;
    --on-deep-soft: #c3d0de;
    --orange: #eb7024;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 16px;
    background: var(--paper);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main {
    width: min(100%, 1040px);
    display: grid;
    grid-template-columns: minmax(0, 4fr) minmax(0, 7fr);
    align-items: center;
    gap: 48px;
    padding: 56px;
    border-radius: 24px;
    background: var(--deep);
    color: #fff;
    box-shadow: 0 1px 2px rgba(15, 23, 42, 0.06), 0 12px 32px rgba(20, 66, 114, 0.14);
  }
  .code {
    margin: 0;
    font-size: clamp(88px, 14vw, 168px);
    font-weight: 700;
    line-height: 0.9;
    letter-spacing: -0.04em;
  }
  .brand {
    margin: 0 0 20px;
    color: var(--on-deep-soft);
    font-size: 13px;
    font-weight: 600;
  }
  .eyebrow {
    margin: 0;
    color: var(--orange);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  h1 {
    margin: 14px 0 0;
    font-size: clamp(28px, 3.4vw, 40px);
    line-height: 1.15;
    letter-spacing: -0.02em;
  }
  p.lead {
    max-width: 560px;
    margin: 16px 0 0;
    color: var(--on-deep-muted);
    font-size: 18px;
    line-height: 28px;
  }
  a.button {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    height: 48px;
    margin-top: 28px;
    padding-inline: 24px;
    border-radius: 9999px;
    background: #fff;
    color: var(--deep);
    font-size: 14.5px;
    font-weight: 600;
    text-decoration: none;
  }
  a.button:hover { background: #eef2f7; }
  a.button:focus-visible { outline: 2px solid var(--orange); outline-offset: 3px; }
  @media (max-width: 760px) {
    main { grid-template-columns: 1fr; gap: 8px; padding: 36px 24px; }
  }
</style>
</head>
<body>
<main>
  <p class="code" aria-hidden="true">502</p>
  <div>
    <p class="brand">UPNG Science, Research and Innovation Society</p>
    <p class="eyebrow">Error 502 · Bad Gateway</p>
    <h1>We couldn’t reach one of our services.</h1>
    <p class="lead">The site relies on other services to load its content, and one of them sent back an invalid response. This is usually temporary — please try again shortly.</p>
    <a class="button" href="/">Try again <span aria-hidden="true">↻</span></a>
  </div>
</main>
</body>
</html>
